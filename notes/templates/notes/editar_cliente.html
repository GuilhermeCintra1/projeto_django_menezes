{% extends "notes/base.html" %}

{% block content %}
<h1>Editar proprietário</h1>
<form method="post" action="{% url 'editar_cliente' cliente.id %}">
  {% csrf_token %}
  <p>
    <label for="nome">Nome</label>
    <input id="nome" name="nome" type="text" maxlength="200" value="{{ cliente.nome }}" required />
  </p>
  <p>
    <label for="telefone">Telefone</label>
    <input id="telefone" name="telefone" type="tel" maxlength="30" value="{{ cliente.telefone }}" required />
  </p>
  <p>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" maxlength="254" value="{{ cliente.email }}" required />
  </p>
  <button type="submit">Salvar alterações</button>
</form>
<p><a href="{% url 'index' %}">Voltar para proprietários</a></p>
{% endblock %}
