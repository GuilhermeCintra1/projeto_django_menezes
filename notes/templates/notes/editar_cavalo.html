{% extends "notes/base.html" %}

{% block content %}
<h1>Editar cavalo</h1>
{% if cavalo.foto %}
<img class="foto-cavalo" src="{{ cavalo.foto.url }}" alt="Foto de {{ cavalo.nome }}" width="360" />
{% endif %}
<form class="formulario" method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {% if user.is_staff %}
  <p>
    <label for="proprietario">Proprietário</label>
    <select id="proprietario" name="proprietario" required>
      <option value="">Escolha o proprietário</option>
      {% for cliente in clientes %}
      <option value="{{ cliente.id }}" {% if cliente.id == cavalo.proprietario_id %}selected{% endif %}>{{ cliente.nome }}</option>
      {% endfor %}
    </select>
  </p>
  {% endif %}
  {{ form.as_p }}
  <button type="submit">Salvar alterações</button>
</form>
<p><a href="{% url 'cavalos' %}">Voltar para cavalos</a></p>
{% endblock %}
